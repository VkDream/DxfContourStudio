name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test (Windows, .NET 10, x64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DxfContourStudio.sln

      - name: Build Debug
        run: dotnet build DxfContourStudio.sln -c Debug --no-restore -p:Platform=x64

      - name: Test Debug
        run: dotnet test DxfContourStudio.sln -c Debug --no-build -p:Platform=x64 --logger "trx;LogFileName=test-debug.trx"

      - name: Build Release
        run: dotnet build DxfContourStudio.sln -c Release --no-restore -p:Platform=x64

      - name: Test Release
        run: dotnet test DxfContourStudio.sln -c Release --no-build -p:Platform=x64 --logger "trx;LogFileName=test-release.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/*.trx'
          retention-days: 14
